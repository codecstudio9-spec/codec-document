# Configuración de las Edge Functions.
#
# ── Por qué existe este archivo ──────────────────────────────────────────
# Tres funciones tienen que responder SIN JWT de usuario: Wompi y Resend no
# pueden presentar uno; notify-completion se llama desde el flujo público de
# firma y valida que la transacción ya esté completada antes de enviar.
#
# Eso se venía pasando como bandera suelta en la línea de comandos
# (`--no-verify-jwt`), con dos problemas: no queda escrito en ninguna parte, y
# quien redespliegue sin acordarse deja la función exigiendo un token que el
# emisor no tiene — con lo que los pagos y los correos dejan de entrar sin que
# nada falle de forma visible. Declarado aquí, el ajuste viaja con el repo.
#
# ── Que no verifiquen JWT no significa que estén abiertas ────────────────
# Las dos comprueban la firma del emisor antes de tocar nada:
#   · wompi-webhook   → firma de eventos de Wompi (WOMPI_EVENTS_SECRET)
#   · correo-entrante → firma Svix de Resend      (RESEND_INBOUND_SECRET)
#   · notify-completion → solo envía para un UUID de transacción completada
# El invitador send-signing-invitation sí exige JWT y valida que la sesión sea
# dueña del documento. El resto falla cerrado según sus propias credenciales.

[functions.wompi-webhook]
verify_jwt = false

[functions.correo-entrante]
verify_jwt = false

[functions.notify-completion]
verify_jwt = false

[functions.send-signing-invitation]
verify_jwt = true
