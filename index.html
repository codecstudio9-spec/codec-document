

<!DOCTYPE html>
<!-- translate="no" no es una preferencia de estilo: es lo que impide que la
     aplicación se caiga.

     Chrome ofrece traducir cualquier página cuyo idioma declarado no coincida
     con el del usuario, y aquí coincidía siempre: este shell estático sirve
     ~190 rutas y declara lang="en", aunque casi todo el contenido para
     Latinoamérica está en español (el LanguageProvider corrige el atributo,
     pero ya en tiempo de ejecución, después de que Chrome decidió).

     Al traducir, Chrome REEMPLAZA los nodos de texto del DOM. React sigue
     creyendo que los suyos están donde los dejó, y en el siguiente re-render
     llama a insertBefore o removeChild sobre nodos que ya no existen: eso
     lanza NotFoundError y la frontera de errores cambia la página entera por
     «Ocurrió un inconveniente». Se disparaba justo en las pantallas que más
     se repintan — el dictado por voz, que actualiza el texto varias veces por
     segundo, y el progreso de la descarga DIAN. La pista fue un botón que en
     pantalla decía «Dictador», palabra que no existe en el código.

     Desactivarlo no le quita nada a nadie: la aplicación ya se ofrece en
     español e inglés con su propio selector, que traduce de verdad —textos,
     documentos y plantillas— en vez de reescribir el HTML por encima. -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <!-- La misma instrucción para el traductor de Google, que no siempre
         respeta el atributo translate del elemento raíz. -->
    <meta name="google" content="notranslate" />

    <!-- ═══ PWA / installability ══════════════════════════════════════════════ -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <!-- Google's favicon crawler requires an icon that's a multiple of 48px
         (see developers.google.com/search/docs/appearance/favicon) — the
         32x32/16x16 above don't qualify, so it was falling back to a
         generic globe in search results. Reusing the existing PWA icon. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codec Document" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ═══ Primary SEO ═══════════════════════════════════════════════════════ -->
    <title>Legal Documents &amp; Electronic Signatures | CodecDocument</title>
    <meta name="description" content="Create legal documents, collect electronic signatures and verify signer identity with audit trails and geolocation evidence. Secure, simple and built for modern businesses." />
    <meta name="keywords" content="legal documents, electronic signatures, e-signature platform, digital signatures, identity verification, document signing, esign act compliant, ueta compliant, legal document generator, secure document workflow, audit trail, geolocation verification" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="Codec Document" />
    <meta name="copyright" content="Codec Document" />
    <meta name="rating" content="general" />
    <meta name="revisit-after" content="7 days" />

    <!-- ═══ Open Graph ════════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.codecdocument.com" />
    <meta property="og:title" content="CodecDocument — Create, Sign &amp; Verify Documents" />
    <meta property="og:description" content="Generate legal documents, collect signatures and verify signer identity with audit trails and geolocation evidence." />
    <meta property="og:image" content="https://www.codecdocument.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Codec Document — Free Legal Document Generator and E-Signature Platform" />
    <meta property="og:site_name" content="Codec Document" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />

    <!-- ═══ Twitter / X Card ═════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@codecdocument" />
    <meta name="twitter:title" content="CodecDocument — Create, Sign &amp; Verify Documents" />
    <meta name="twitter:description" content="Create legal documents, collect signatures and verify signer identity with audit records and location verification." />
    <meta name="twitter:image" content="https://www.codecdocument.com/og-image.png" />

    <!-- ═══ Canonical + Alternates ════════════════════════════════════════════
         Intentionally NOT present here: this single static HTML shell is
         served for ~200 different routes (Vercel SPA rewrite in vercel.json),
         so a canonical/hreflang hardcoded to the homepage was wrong on every
         other one of them — the exact "Google chose a different canonical"
         failure mode. The real per-route canonical/hreflang is set by
         middleware.ts as an HTTP `Link` response header (seen by every
         crawler, JS or not) and reinforced client-side by SEOHead.tsx
         (src/app/components/seo-head.tsx) once React mounts. -->

    <!-- ═══ Preconnect for performance ════════════════════════════════════════
         No Google Fonts preconnect here on purpose — src/styles/fonts.css is
         empty, the whole app uses the system font stack, so a Google Fonts
         preconnect would just be a wasted DNS+TLS handshake competing with
         resources that actually matter for LCP. -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://www.paypal.com" />

    <!-- ═══ Inline critical styles ════════════════════════════════════════════ -->
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
